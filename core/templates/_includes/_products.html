<!-- Template for displaying a single product card -->



 
<tr>
    <th scope="row">1</th>
      <td>{{ product.product_id }}</td>
      <td>{{ product.product_name }}</td>
      <td>{{ product.stock }}</td>
      <td>{{ product.category }}</td>
      <td>{{ product.supplier }}</td>
      <td>{{ product.add_at }}</td>
      <td>{{ product.exit_at|date:"d-m-Y" }}</td>
 </tr>
