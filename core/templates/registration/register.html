{% extends 'general/layout.html' %}
{% load static %}
{% load crispy_forms_tags %}
{% block head_title %}Registro{% endblock %}
{% block content %}

<!-- Register form -->
  <div class="row">
  <div class="col-12 col-md-6 offset-md-3">
    <div class="card">
      <div class="card-body   d-flex flex-column align-items-center text-info">
        <h1 class="card-title">Registrarse</h1>
        
        <form  action="" method="post" autocomplete="off">
        {% csrf_token %} 
          <div id="django-form" class="d-flex flex-column ali align-items-center text-info">
            
            {{ form| crispy }}
          
          </div>
          <button class="btn btn-sm btn-outline-info">Enviar</button>
        </form>
        </div>
    </div>
  </div> 
</div>     



{% endblock %}
