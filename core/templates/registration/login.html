{% extends 'general/layout.html' %}
{% load static %}
{% load crispy_forms_tags %} {% load i18n %}
{% block head_title %}Login{% endblock %}
{% block content %}

<!-- Login form -->
<div class="row">
  <div class="col-12 col-md-6 offset-md-3">
    <div class="card">
      <div class="card-body  d-flex flex-column align-items-center">
        
        <h1 class="card-title text-center text-info">Iniciar sesion</h1>
        <hr>
        
        <form id="login" action="{% url 'login' %}" method="post" autocomplete="off">
          {% csrf_token %} 
          <div id="django-form" class="d-flex flex-column ali align-items-center text-info">
           {{ form| crispy }}

          </div>  
          <button type="submit" class="btn btn-sm btn btn-outline-info">Login</button>
        </form>
      </div>
    </div>  
  </div>
</div>

{% endblock %}
